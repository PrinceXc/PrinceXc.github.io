baseURL = "https://princexc.github.io/"
languageCode = "zh-CN"
title = "云途码志"
author = "PrinceXc"
description = "以码为途，记录成长"
theme = "ananke"

summaryLength = 30

[params]
    author = "PrinceXc"
    description = "以码为途，记录成长"
    title = "云途码志"
    defaultTheme = "dark"
    disableThemeToggle = false
    DateFormat = "2006/01/02 15:04"
    ShowReadingTime = true
    ShowShareButtons = false
    ShowPostNavLinks = true
    ShowBreadCrumbs = true
    ShowCodeCopyButtons = true

    [params.profileMode]
        enabled = false

[menu]
    [[menu.main]]
        identifier = "posts"
        name = "文章"
        url = "/posts/"
        weight = 10
    [[menu.main]]
        identifier = "search"
        name = "搜索"
        url = "/search/"
        weight = 20

[outputs]
    home = ["HTML", "RSS", "JSON"]

[markup]
    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true