{{- define "main" -}}
<div class="wrapper post">
    <main class="page-content" aria-label="Content">
        <article>
            <header class="header">
                <h1 class="header-title">{{ .Title }}</h1>
            </header>
            <div class="page-content">
                <input type="search" id="search-input" placeholder="输入关键词搜索…" autocomplete="off"
                    style="width:100%;padding:10px 12px;font-size:16px;border:1px solid #c4c8cc;border-radius:6px;background:transparent;color:inherit;">
                <div id="search-results" style="margin-top:1.5rem;"></div>
            </div>
        </article>
    </main>
</div>

<script>
(async function () {
    const input = document.getElementById('search-input');
    const box = document.getElementById('search-results');
    let posts = [];
    try {
        const res = await fetch('/index.json');
        posts = await res.json();
    } catch (e) {
        box.innerHTML = '<p>搜索索引加载失败。</p>';
        return;
    }

    function escapeHtml(s) {
        return String(s || '').replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    function render(list, keyword) {
        if (!keyword) { box.innerHTML = ''; return; }
        if (!list.length) { box.innerHTML = '<p>没有找到匹配的内容。</p>'; return; }
        box.innerHTML = list.slice(0, 20).map(p => `
            <div class="search-result" style="text-align:left;padding:.7rem 0;border-bottom:1px solid rgba(128,128,128,.35);">
                <h4 style="margin:0;font-size:16px;font-weight:500;">
                    <a href="${escapeHtml(p.permalink)}" style="color:inherit;text-decoration:none;">${escapeHtml(p.title)}</a>
                </h4>
                <p style="margin:.3rem 0 0;font-size:.9em;opacity:.75;text-align:left;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">
                    ${escapeHtml(p.summary)}
                </p>
            </div>`).join('');
    }

    input.addEventListener('input', function () {
        const kw = this.value.trim().toLowerCase();
        if (!kw) { render([], ''); return; }
        render(posts.filter(p =>
            (p.title || '').toLowerCase().includes(kw) ||
            (p.content || '').toLowerCase().includes(kw)
        ), kw);
    });

    // 支持 /search/?q=关键词 直接带词打开
    const initial = new URLSearchParams(location.search).get('q');
    if (initial) {
        input.value = initial;
        render(posts.filter(p =>
            (p.title || '').toLowerCase().includes(initial.toLowerCase()) ||
            (p.content || '').toLowerCase().includes(initial.toLowerCase())
        ), initial.toLowerCase());
    }
    input.focus();
})();
</script>
{{- end -}}
